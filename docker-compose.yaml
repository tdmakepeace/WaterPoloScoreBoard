services:
  scoreboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: waterpolo-scoreboard
    container_name: waterpolo-scoreboard
    ports:
      - "${SCOREBOARD_HOST_PORT:-10080}:5000"
    environment:
      SCOREBOARD_BROWSER_ONLY: "true"
      SCOREBOARD_LISTENING_PORT: "5000"
    volumes:
      - ./results:/app/results
    restart: unless-stopped
