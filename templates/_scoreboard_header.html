<header>
    <h1>
        <span id="sb-home-red" class="{% if home_coach.red >= 1 %}red{% else %}none{% endif %}">{{ home_coach['red'] }}</span>
        <span id="sb-home-yellow" class="{% if home_coach.yellow >= 1 %}yellow{% else %}none{% endif %}">{{ home_coach.yellow }}</span>
        <!-- <span style="font-size: 28px; color: #888;">{{ home_coach['AC'] }}</span>
        <span style="font-size: 28px; color: #888;">{{ home_coach['TM'] }}</span> -->
        <span style="font-size: 30px; color: #050505;">spacer</span>
        <span id="sb-hometimeout" style="font-size: 30px; color: white;">{{ hometimeoutv }}</span>
        <span id="sb-home-goals" style="font-size: 300px; color: #ffffff;">{{ TeamHome['goals'] }}</span>
        <span id="sb-location" style="font-size: 100px; color: blue; width: 1000px;">{{location}}</span>
        <span id="sb-away-goals" style="font-size: 300px; color: rgba(255, 191, 0, 1);">{{ TeamAway['goals'] }}</span>
        <span id="sb-awaytimeout" style="font-size: 30px; color: white;">{{ awaytimeoutv }}</span>
        <span style="font-size: 30px; color: #050505;">spacer</span>
        <span id="sb-away-red" class="{% if away_coach.red >= 1 %}red{% else %}none{% endif %}">{{ away_coach['red'] }}</span>
        <span id="sb-away-yellow" class="{% if away_coach.yellow == 1 %}yellow{% else %}none{% endif %}">{{ away_coach.yellow }}</span>
        <!-- <span style="font-size: 28px; color: #888;">{{ away_coach['AC'] }}</span>
        <span style="font-size: 28px; color: #888;">{{ away_coach['TM'] }}</span> -->
    </h1>
</header>
