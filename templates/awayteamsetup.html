<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Form</title>
   <style>
        /* Basic styling for the layout */
        html {
            min-height: 100%;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            height: auto;
        }

        #csvControls {
            max-width: 600px;
            width: 100%;
            margin: 20px auto 0 auto;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 10px;
        }

        #csvPreview {
            margin-top: 10px;
            max-height: 420px;
            overflow: auto;
            border: 1px solid #eee;
            border-radius: 8px;
            padding: 10px;
        }

        #csvPreview .preview-staff-table .missing {
            color: #999;
            font-style: italic;
        }

        #csvPreview table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        #csvPreview th, #csvPreview td {
            border: 1px solid #ddd;
            padding: 6px;
            text-align: left;
            vertical-align: top;
        }

        #csvStatus {
            margin-top: 10px;
            font-size: 14px;
        }

        header {
            background-color: #333;
            color: #fff;
            text-align: center;
            width: 100%;
            padding: 40px 0;
        }

        form {
            max-width: 600px;
            width: 100%;
            padding: 20px;
            margin: 20px auto;
        }

        #entries {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        #entries > div {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #staffSection {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid #ddd;
        }

        #staffSection > div {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #staffSection .staff-role {
            min-width: 140px;
            font-weight: bold;
        }

        label {
            min-width: 80px;
            font-weight: bold;
        }

        input[type="text"] {
            padding: 5px;
            font-size: 14px;
        }

        input[readonly] {
            background-color: #e9ecef;
            cursor: not-allowed;
            width: 60px;
            text-align: center;
        }

        input[name^="name_"] {
            flex: 1;
            min-width: 200px;
        }

        #staffSection input[type="text"] {
            flex: 1;
            min-width: 200px;
        }

        input[type="submit"] {
            margin-top: 20px;
            padding: 10px 30px;
            font-size: 16px;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 3px 6px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }

        input[type="submit"]:hover {
            background: linear-gradient(135deg, #0e7e6f 0%, #2dd368 100%);
            transform: translateY(-2px);
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.3);
        }
        </style>
    <script>
        function addEntry() {
            const entriesDiv = document.getElementById('entries');
            const entryIndex = entriesDiv.childElementCount;

            const entryDiv = document.createElement('div');
            entryDiv.innerHTML = `

                <label for="name_${entryIndex}">Player${entryIndex+1}:</label>
                <input type="number" id="hatnum_${entryIndex}" name="hatnum_${entryIndex}">
                <input type="text" id="name_${entryIndex}" name="name_${entryIndex}"><br><br>

            `;
            entriesDiv.appendChild(entryDiv);

            // Update the number of entries
            document.getElementById('num_entries').value = entryIndex + 1;
        }

        // CSV: numeric hat -> players; HC / AC / TM -> away_staff fields
        let _csvParsedRows = { players: [], staff: [] };

        const _STAFF_ROLES = new Set(["HC", "AC", "TM"]);

        function _normalizeStaffRole(value) {
            const u = (value ?? "").toString().trim().toUpperCase();
            return _STAFF_ROLES.has(u) ? u : null;
        }

        function _detectDelimiter(text) {
            const firstNonEmptyLine = text.split(/\r?\n/).find(l => l.trim().length > 0) || "";
            if (!firstNonEmptyLine) return ",";
            const hasComma = firstNonEmptyLine.includes(",");
            const hasSemicolon = firstNonEmptyLine.includes(";");
            return hasSemicolon && !hasComma ? ";" : ",";
        }

        function _parseCSV(text) {
            const delimiter = _detectDelimiter(text);
            const normalized = text.replace(/\r\n/g, "\n").replace(/\r/g, "\n");

            const rows = [];
            let row = [];
            let field = "";
            let inQuotes = false;

            for (let i = 0; i < normalized.length; i++) {
                const c = normalized[i];

                if (inQuotes) {
                    if (c === '"') {
                        if (normalized[i + 1] === '"') {
                            field += '"';
                            i++;
                        } else {
                            inQuotes = false;
                        }
                    } else {
                        field += c;
                    }
                    continue;
                }

                if (c === '"') {
                    inQuotes = true;
                    continue;
                }

                if (c === delimiter) {
                    row.push(field.trim());
                    field = "";
                    continue;
                }

                if (c === "\n") {
                    row.push(field.trim());
                    field = "";

                    if (row.some(v => v !== "")) {
                        rows.push(row);
                    }
                    row = [];
                    continue;
                }

                field += c;
            }

            if (field.length > 0 || row.length > 0) {
                row.push(field.trim());
                if (row.some(v => v !== "")) rows.push(row);
            }

            return rows;
        }

        function _isNumericHat(value) {
            const v = (value ?? "").toString().trim();
            if (!v) return false;
            const n = parseInt(v, 10);
            return !Number.isNaN(n);
        }

        function refreshCsvPreview() {
            const fileInput = document.getElementById("csvFile");
            const statusEl = document.getElementById("csvStatus");
            const previewEl = document.getElementById("csvPreview");

            const file = fileInput.files && fileInput.files[0];
            if (!file) {
                statusEl.textContent = "Choose a CSV file first.";
                previewEl.innerHTML = "";
                _csvParsedRows = { players: [], staff: [] };
                return;
            }

            statusEl.textContent = "Reading and parsing CSV...";
            previewEl.innerHTML = "";
            _csvParsedRows = { players: [], staff: [] };

            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const text = e.target.result || "";
                    const parsed = _parseCSV(text);

                    const players = [];
                    const staff = [];
                    for (let idx = 0; idx < parsed.length; idx++) {
                        const r = parsed[idx];
                        const hat = (r[0] ?? "").toString().trim();
                        const name = (r[1] ?? "").toString().trim();

                        if (!hat && !name) continue;

                        const role = _normalizeStaffRole(hat);
                        if (role) {
                            staff.push({ role, name });
                            continue;
                        }

                        if (!_isNumericHat(hat)) continue;

                        players.push({ hat: String(parseInt(hat, 10)), name });
                    }

                    if (players.length === 0 && staff.length === 0) {
                        statusEl.textContent = "No valid rows. Players: hat_number,name. Staff: HC, AC, or TM then name.";
                        previewEl.innerHTML = "";
                        _csvParsedRows = { players: [], staff: [] };
                        return;
                    }

                    _csvParsedRows = { players, staff };

                    const staffByRole = new Map();
                    for (const s of staff) {
                        staffByRole.set(s.role, s.name);
                    }

                    let html = "";

                    html += "<div style='font-weight:bold;margin:0 0 6px;'>Staff in CSV (HC, AC, TM)</div>";
                    html += "<table class='preview-staff-table'><thead><tr><th>Role</th><th>Name (from file)</th></tr></thead><tbody>";
                    for (const role of ["HC", "AC", "TM"]) {
                        const raw = staffByRole.has(role) ? staffByRole.get(role) : "";
                        const hasVal = (raw ?? "").toString().trim().length > 0;
                        const safeR = role.replace(/[<>&"]/g, "");
                        const safeName = (raw ?? "").toString().replace(/[<>&"]/g, "");
                        const cell = hasVal
                            ? safeName
                            : "<span class='missing'>(not in CSV)</span>";
                        html += `<tr><td><strong>${safeR}</strong></td><td>${cell}</td></tr>`;
                    }
                    html += "</tbody></table>";

                    if (players.length) {
                        html += "<div style='font-weight:bold;margin:16px 0 6px;'>Players (numeric hat)</div>";
                        html += "<table><thead><tr><th>Hat</th><th>Name</th></tr></thead><tbody>";
                        const maxP = 200;
                        for (const p of players.slice(0, maxP)) {
                            const safeHat = p.hat.replace(/[<>&"]/g, "");
                            const safeName = p.name.replace(/[<>&"]/g, "");
                            html += `<tr><td>${safeHat}</td><td>${safeName}</td></tr>`;
                        }
                        html += "</tbody></table>";
                        if (players.length > maxP) {
                            html += `<div style="margin-top:8px;color:#666;">Showing first ${maxP} of ${players.length} player rows.</div>`;
                        }
                    }

                    previewEl.innerHTML = html;
                    const staffFilled = ["HC", "AC", "TM"].filter((r) => staffByRole.has(r) && (staffByRole.get(r) ?? "").toString().trim()).length;
                    statusEl.textContent =
                        `CSV parsed. Staff rows with names: ${staffFilled}/3. Players: ${players.length}. Click "Apply to Form" to fill inputs.`;
                } catch (err) {
                    previewEl.innerHTML = "";
                    _csvParsedRows = { players: [], staff: [] };
                    statusEl.textContent = "Failed to parse CSV.";
                    console.error(err);
                }
            };

            reader.onerror = () => {
                statusEl.textContent = "Failed to read CSV file.";
            };

            reader.readAsText(file);
        }

        function applyCsvToForm() {
            const statusEl = document.getElementById("csvStatus");
            const previewEl = document.getElementById("csvPreview");
            const data = _csvParsedRows;
            const numEntries = parseInt(document.getElementById("num_entries").value, 10) || 0;

            if (!data || ((!data.players || !data.players.length) && (!data.staff || !data.staff.length))) {
                statusEl.textContent = "Refresh the CSV preview first.";
                return;
            }

            const hatToNameInput = new Map();
            for (let i = 0; i < numEntries; i++) {
                const hatEl = document.getElementById(`hatnum_${i}`);
                const nameEl = document.getElementById(`name_${i}`);
                if (!hatEl || !nameEl) continue;
                const hat = (hatEl.value ?? "").toString().trim();
                if (hat) hatToNameInput.set(hat, nameEl);
            }

            let appliedPlayers = 0;
            let ignoredPlayers = 0;

            if (data.players && data.players.length) {
                for (let i = 0; i < numEntries; i++) {
                    const nameEl = document.getElementById(`name_${i}`);
                    if (nameEl) nameEl.value = "";
                }
                for (const p of data.players) {
                    const nameEl = hatToNameInput.get(String(p.hat));
                    if (nameEl) {
                        nameEl.value = p.name;
                        appliedPlayers++;
                    } else ignoredPlayers++;
                }
            }

            if (data.staff && data.staff.length) {
                for (const role of ["HC", "AC", "TM"]) {
                    const el = document.getElementById(`staff_name_${role}`);
                    if (el) el.value = "";
                }
                for (const s of data.staff) {
                    const el = document.getElementById(`staff_name_${s.role}`);
                    if (el) el.value = s.name;
                }
            }

            const parts = [];
            if (data.players && data.players.length) {
                parts.push(`${appliedPlayers} player name(s); ignored hats: ${ignoredPlayers}`);
            }
            if (data.staff && data.staff.length) {
                parts.push(`${data.staff.length} staff row(s)`);
            }
            statusEl.textContent = `Applied CSV (${parts.join("; ")}). Submit to save.`;

            previewEl.scrollIntoView({ behavior: "smooth", block: "nearest" });
        }
    </script>
</head>
<body>

  <header>

      <h1>
          <span style="font-size: 120px; color: grey;">&nbsp;&nbsp;&nbsp;Away Team Names&nbsp;&nbsp;&nbsp;&nbsp; </span>
      </h1>
  </header>

    <form action="/saveawayplayers/{{ user_id }}" method="POST">
        <input type="hidden" id="num_entries" name="num_entries" value="{{ data|length }}">
        <div id="entries">
            {% for record in data %}
            <div>
                <label for="name_{{ loop.index0 }}">Player:</label>
                 <input type="text" id="hatnum_{{ loop.index0 }}" name="hatnum_{{ loop.index0 }}" value="{{ record[0] }}" readonly>
                <input type="text" id="name_{{ loop.index0 }}" name="name_{{ loop.index0 }}" value="{{ record[1] }}">
            </div>
            {% endfor %}
        </div>

        <div id="staffSection">
            <div style="font-weight:bold;font-size:16px;margin-bottom:4px;">Away staff</div>
            {% for record in (staff_data or []) %}
            <div>
                <span class="staff-role">{{ record[0] }}</span>
                <input type="text" id="staff_name_{{ record[0] }}" name="staff_{{ record[0] }}" value="{{ record[1] }}">
            </div>
            {% endfor %}
        </div>

        <div id="csvControls">
            <div style="font-weight:bold;font-size:16px;margin-bottom:8px;">Import Away roster CSV</div>
            <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;">
                <input type="file" id="csvFile" accept=".csv,text/csv">
                <button type="button" onclick="refreshCsvPreview()">Refresh Preview</button>
                <button type="button" onclick="applyCsvToForm()">Apply to Form</button>
            </div>
            <div style="margin-top:8px;color:#555;font-size:13px;">
                Players: <code>hat_number,name</code>. Staff: <code>HC</code>, <code>AC</code>, or <code>TM</code> in the first column, name in the second. One file can include both. Header row optional.
            </div>
            <div id="csvStatus"></div>
            <div id="csvPreview"></div>
        </div>

        <input type="submit" value="Submit">
    </form>
</body>
</html>
